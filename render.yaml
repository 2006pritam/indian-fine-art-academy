# Render Blueprint — deploy the academy app as a web service.
# In Render: New + → Blueprint → connect this repo. Render reads this file and
# creates the web service. You provide DATABASE_URL yourself (your existing
# hosted Postgres) so all current student data carries over.
services:
  - type: web
    name: imfaa
    runtime: node
    plan: free
    # Install deps and build the frontend into dist/ (served by the Express server).
    buildCommand: npm install && npm run build
    # Run only the API/server in production; it serves dist/ and the API on one port.
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      # Your existing hosted Postgres connection string.
      # sync:false means Render will PROMPT you to paste it in the dashboard
      # (kept secret, never committed to the repo).
      - key: DATABASE_URL
        sync: false
      # Secret for signing login tokens — Render generates a strong random value.
      - key: JWT_SECRET
        generateValue: true
      # Default admin login — CHANGE these in the Render dashboard after first deploy.
      - key: ADMIN_ID
        value: uttam5879
      - key: ADMIN_PASSWORD
        value: "5050"
      - key: NODE_VERSION
        value: "22"
      # Payment gateway settings. Add the replacement secret in Render, never in git.
      - key: PAYMENT_API_KEY
        sync: false
      - key: PAYMENT_API_URL
        value: https://famapi.mistahub.in/api
      - key: PUBLIC_APP_URL
        sync: false
